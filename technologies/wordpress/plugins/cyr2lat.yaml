id: wordpress-cyr2lat

info:
  name: Cyr-To-Lat Detection
  author: ricardomaia
  severity: info
  reference:
    - https://wordpress.org/plugins/cyr2lat/
  metadata:
    plugin_namespace: cyr2lat
    wpscan: https://wpscan.com/plugin/cyr2lat
  tags: tech,wordpress,wp-plugin,top-200

requests:
  - method: GET

    path:
      - "{{BaseURL}}/wp-content/plugins/cyr2lat/readme.txt"

    payloads:
      last_version: helpers/wordpress/plugins/cyr2lat.txt

    extractors:
      - type: regex
        part: body
        internal: true
        name: internal_detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

      - type: regex
        part: body
        name: detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

    matchers-condition: or
    matchers:
      - type: dsl
        name: "outdated_version"
        dsl:
          - compare_versions(internal_detected_version, concat("< ", last_version))

      - type: regex
        part: body
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'
